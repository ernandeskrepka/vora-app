# Deploy no Render: web + worker a partir deste repositorio, compartilhando
# banco, Redis e variaveis. No Railway a ideia e a mesma: dois servicos, mesmo
# repositorio, comandos de start diferentes.
services:
  - type: web
    name: vora-aprovacao-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vora-aprovacao-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vora-aprovacao-redis
          type: redis
          property: connectionString
      # Preencha no painel (marcadas como sync: false).
      - key: APP_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_SYSTEM_USER_TOKEN
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_DRY_RUN
        value: "true"
      - key: WHATSAPP_MODE
        value: log
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: INTERNAL_NOTIFY_CHANNEL
        value: log
      - key: SLACK_WEBHOOK_URL
        sync: false

  - type: worker
    name: vora-aprovacao-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vora-aprovacao-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vora-aprovacao-redis
          type: redis
          property: connectionString
      - key: APP_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_SYSTEM_USER_TOKEN
        sync: false
      - key: META_DRY_RUN
        value: "true"
      - key: WHATSAPP_MODE
        value: log
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: INTERNAL_NOTIFY_CHANNEL
        value: log
      - key: SLACK_WEBHOOK_URL
        sync: false

  - type: redis
    name: vora-aprovacao-redis
    plan: starter
    ipAllowList: []

databases:
  - name: vora-aprovacao-db
    plan: basic-256mb
