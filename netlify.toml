# Deploy do painel e do site de aprovacao na Netlify.
#
# Atencao ao que muda em relacao ao deploy normal (Render/Railway):
# - nao existe processo continuo, entao o worker e substituido pela funcao
#   agendada abaixo, que chama /api/agenda de minuto em minuto;
# - nao existe disco, entao os criativos vao para o Netlify Blobs;
# - o banco e Postgres gerenciado (Netlify DB ou externo), via DATABASE_URL.

[build]
  command = "prisma generate && node scripts/preparar-hospedagem.mjs && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PRISMA_SKIP_POSTINSTALL_GENERATE = "true"
  # Padroes desta hospedagem, validos SO no build: a Netlify nao repassa o
  # [build.environment] para as funcoes. As mesmas chaves precisam estar nas
  # variaveis do site (Environment variables) para valerem em execucao, junto
  # com os segredos (ENCRYPTION_KEY, AGENDA_TOKEN, ADMIN_EMAIL, ADMIN_SENHA).
  QUEUE_DRIVER = "none"
  STORAGE_DRIVER = "netlify"
  META_DRY_RUN = "true"
  WHATSAPP_MODE = "log"
  INTERNAL_NOTIFY_CHANNEL = "log"
  APP_TIMEZONE = "America/Sao_Paulo"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

[functions.agenda]
  included_files = []
